# Example pulsemq configuration.
#
# Copy to `pulsemq.yaml` (auto-loaded from the working directory) or point
# at it with `--config <FILE>` / MQTT_CONFIG_FILE. Every key is optional and
# corresponds to a CLI flag / environment variable. Precedence, lowest to
# highest: this file < environment variables < command-line flags.

# --- MQTT listener (raw TCP) ---
listen_addr: "0.0.0.0:1883"
# tls_cert: "certs/server.pem"       # both cert+key set => MQTT over TLS (8883)
# tls_key: "certs/server.key"
# tls_client_ca: "certs/ca.pem"      # also set => require & verify client certs (mTLS)

# --- MQTT over WebSockets (optional; omit to disable) ---
# ws_listen_addr: "0.0.0.0:8080"
# ws_tls_cert: "certs/server.pem"    # both set => wss://
# ws_tls_key: "certs/server.key"
# ws_tls_client_ca: "certs/ca.pem"   # also set => mutual TLS on the WS port

# --- Admin / metrics / MCP HTTP server ---
admin_addr: "127.0.0.1:9001"
# admin_token: "change-me"           # bearer token required for /metrics and /mcp
# admin_tls_cert: "certs/server.pem" # both set => HTTPS
# admin_tls_key: "certs/server.key"
# admin_tls_client_ca: "certs/ca.pem"

# --- Authentication & authorization ---
# password_file: "passwd"            # username/password credentials; when set, auth is required
# allow_anonymous: false             # allow clients with no credentials (auth'd users still verified)
# acl_path: "acl.json"               # per-identity publish/subscribe ACL (SIGHUP reloads)
#
# Generate a password_file entry (password read from stdin):
#   pulsemq --hash-password alice >> passwd

# --- Storage & limits ---
db_path: "mqtt_broker.db"
max_packet_size: 1048576             # bytes
receive_maximum: 64                  # concurrent unacked QoS>0 publications
max_session_expiry: 3600             # seconds

# --- Protocol capabilities (advertised to clients in CONNACK) ---
maximum_qos: 2                       # 0, 1, or 2
retain_available: true
topic_alias_maximum: 16
# server_keep_alive: 60              # override the client's Keep Alive (seconds)

# --- Forwarding / bridges to remote brokers (config-file only) ---
# bridges:
#   - name: central
#     address: "tls://central.example:8883"  # tcp|tls|ws|wss (mqtt/mqtts alias tcp/tls)
#     client_id: "pulsemq-edge-1"            # optional
#     username: "edge"                        # optional
#     password: "secret"
#     keepalive: 30                           # seconds
#     protocol_version: 5                     # 3 | 4 | 5
#     tls_ca: "certs/ca.pem"                  # required for tls/wss
#     # tls_cert / tls_key                    # optional (mutual TLS)
#     # tls_insecure: false                   # skip server verification (danger)
#     topics:
#       - { pattern: "sensors/#", direction: out,  qos: 1 }  # local -> remote
#       - { pattern: "cmd/#",     direction: in,   qos: 1 }  # remote -> local
#       - { pattern: "state/#",   direction: both, qos: 0 }
