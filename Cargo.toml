[package]
name = "mqtt_server"
version = "0.1.0"
edition = "2021"
description = "An MQTT v5.0 broker implemented in Rust with tokio and SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elpapimango/mqtt_server"
readme = "README.md"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
bytes = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
x509-parser = "0.16"

[profile.release]
lto = true
codegen-units = 1
