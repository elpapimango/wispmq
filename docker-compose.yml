# Example Docker Compose for the MQTT v5.0 broker.
#
#   docker compose up -d
#
# Pulls the published image from GHCR. To build locally instead, comment out
# `image:` and uncomment `build: .`.

services:
  mqtt:
    image: ghcr.io/elpapimango/wispmq:latest
    # build: .
    container_name: wispmq
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT (plain)
      # - "8883:8883" # MQTT over TLS
      # - "8080:8080" # MQTT over WebSockets
      - "9001:9001" # admin: /health, Prometheus /metrics, MCP /mcp
    environment:
      RUST_LOG: info
      # Protect the admin endpoints (unauthenticated by default):
      MQTT_ADMIN_TOKEN: "change-me"
      # Enable extra transports / features by pointing at mounted files:
      # MQTT_WS_LISTEN_ADDR: "0.0.0.0:8080"
      # MQTT_TLS_CERT: "/config/server.pem"
      # MQTT_TLS_KEY: "/config/server.key"
      # MQTT_PASSWORD_FILE: "/config/passwd"
      # MQTT_ACL_FILE: "/config/acl.json"
    volumes:
      - mqtt-data:/data # persistent SQLite state
      # - ./config:/config:ro # certs, password file, ACL, TOML config

volumes:
  mqtt-data:
